name: Functional Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test-save-load:
    runs-on: ubuntu-22.04
    timeout-minutes: 10  # Reduced from 30 since we skip installation

    # Use pre-built Docker image with all dependencies
    container:
      image: ghcr.io/mipdr/sc-clip-tests-docker:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sc-clip to Extensions directory
        run: |
          echo "========================================"
          echo "Installing sc-clip classes"
          echo "========================================"
          SC_EXTENSIONS_DIR="/root/.local/share/SuperCollider/Extensions"
          mkdir -p "$SC_EXTENSIONS_DIR"

          # Copy only the Classes directory (not the whole repo with .git, tests, etc.)
          mkdir -p "$SC_EXTENSIONS_DIR/sc-clip"
          cp -r "$GITHUB_WORKSPACE/Classes" "$SC_EXTENSIONS_DIR/sc-clip/"
          cp -r "$GITHUB_WORKSPACE/HelpSource" "$SC_EXTENSIONS_DIR/sc-clip/" 2>/dev/null || true

          echo "OK sc-clip classes installed to $SC_EXTENSIONS_DIR/sc-clip"
          echo ""
          echo "Installed .sc files:"
          find "$SC_EXTENSIONS_DIR/sc-clip" -name "*.sc" | head -10

      - name: Start JACK server
        run: |
          echo "========================================"
          echo "Starting JACK dummy audio server"
          echo "========================================"
          jackd -d dummy -r 48000 -p 1024 &
          JACK_PID=$!
          echo "JACK_PID=$JACK_PID" >> $GITHUB_ENV
          sleep 3
          jack_lsp || echo "WARNING: JACK not responding, tests may fail"

      - name: Start virtual display
        run: |
          echo "========================================"
          echo "Starting virtual display"
          echo "========================================"
          Xvfb :99 -screen 0 1024x768x24 &
          XVFB_PID=$!
          echo "XVFB_PID=$XVFB_PID" >> $GITHUB_ENV
          sleep 2
          export DISPLAY=:99
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Verify SC class compilation
        run: |
          echo "========================================"
          echo "Verifying SC classes compile"
          echo "========================================"
          echo ""
          echo "Extensions directory contents:"
          ls -la /root/.local/share/SuperCollider/Extensions/
          echo ""
          echo "sc-clip classes:"
          ls -la /root/.local/share/SuperCollider/Extensions/sc-clip/Classes/ | head -5
          echo ""
          echo "Checking sclang config file:"
          if [ -f /root/.config/SuperCollider/sclang_conf.yaml ]; then
            echo "Config file exists:"
            cat /root/.config/SuperCollider/sclang_conf.yaml
          else
            echo "WARNING: Config file does not exist!"
          fi
          echo ""
          export QT_QPA_PLATFORM=offscreen
          export QTWEBENGINE_DISABLE_SANDBOX=1
          export DISPLAY=:99
          timeout 60 sclang -l /root/.config/SuperCollider/sclang_conf.yaml -D scripts/test-compile.scd || {
            echo "ERROR: Class compilation failed"
            exit 1
          }

      - name: Run save/load metadata tests
        run: |
          echo "========================================"
          echo "Running save/load metadata tests"
          echo "========================================"
          export QT_QPA_PLATFORM=offscreen
          export QTWEBENGINE_DISABLE_SANDBOX=1
          # Execute script via load() then the interpreter will quit after the script exits
          echo "\"$(pwd)/Tests/test_save_load_simple.scd\".load;" | timeout 60 sclang -l /root/.config/SuperCollider/sclang_conf.yaml
          TEST_EXIT=$?
          if [ $TEST_EXIT -eq 0 ]; then
            echo ""
            echo "PASS PASS PASS All tests PASSED PASS PASS PASS"
            echo ""
            exit 0
          elif [ $TEST_EXIT -eq 124 ]; then
            echo ""
            echo "ERROR: Tests TIMED OUT after 60 seconds"
            echo ""
            exit 1
          else
            echo ""
            echo "ERROR: Tests FAILED with exit code $TEST_EXIT"
            echo ""
            exit $TEST_EXIT
          fi

      - name: Run MIDI clip tests
        run: |
          export QT_QPA_PLATFORM=offscreen
          export QTWEBENGINE_DISABLE_SANDBOX=1
          echo "\"$(pwd)/Tests/test_midi_clips.scd\".load;" | timeout 60 sclang -l /root/.config/SuperCollider/sclang_conf.yaml
          TEST_EXIT=$?
          if [ $TEST_EXIT -eq 124 ]; then echo "ERROR: MIDI tests TIMED OUT"; exit 1; fi
          exit $TEST_EXIT

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          if [ -n "${JACK_PID:-}" ]; then
            kill $JACK_PID 2>/dev/null || true
          fi
          if [ -n "${XVFB_PID:-}" ]; then
            kill $XVFB_PID 2>/dev/null || true
          fi
          rm -rf /tmp/sc-clip-test-session
          echo "OK Cleanup complete"
