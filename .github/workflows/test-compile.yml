name: Test Compilation

on:
  push:
    branches: ['**']  # Run on all branches
  pull_request:
    branches: ['**']

jobs:
  test-compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test compilation with SuperCollider
        uses: docker://ghcr.io/capital-g/sc-docker:latest
        with:
          args: >
            bash -c "
            mkdir -p /github/home/.local/share/SuperCollider/Extensions &&
            ln -sfn /github/workspace /github/home/.local/share/SuperCollider/Extensions/sc-clip &&
            echo 'Installing dependencies...' &&
            QT_QPA_PLATFORM=offscreen timeout 120 sclang -D /github/workspace/scripts/install-deps.scd &&
            echo 'Running compilation test...' &&
            QT_QPA_PLATFORM=offscreen timeout 60 sclang -D /github/workspace/scripts/test-compile.scd
            "

      - name: Report status
        if: success()
        run: echo "✅ sc-clip quark compiled successfully!"
