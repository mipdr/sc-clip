name: Test Compilation

on:
  push:
    branches: ['**']  # Run on all branches
  pull_request:
    branches: ['**']

jobs:
  test-compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SuperCollider
        run: |
          sudo apt-get update
          sudo apt-get install -y supercollider xvfb

      - name: Verify SuperCollider installation
        run: |
          which sclang
          sclang -version || echo "SuperCollider installed"

      - name: Install sc-clip quark
        run: |
          mkdir -p ~/.local/share/SuperCollider/Extensions
          ln -sfn $GITHUB_WORKSPACE ~/.local/share/SuperCollider/Extensions/sc-clip
          echo "Linked quark to Extensions directory"

      - name: Test SuperCollider class library compilation
        run: |
          echo "Testing if class library compiles with sc-clip..."
          timeout 30 xvfb-run -a sclang -D scripts/test-syntax.scd || {
            echo "Class library failed to compile - checking for syntax errors..."
            timeout 30 xvfb-run -a sclang -version 2>&1 | head -20
            exit 1
          }

      - name: Verify quark metadata
        run: |
          echo "Verifying quark file..."
          test -f sc-clip.quark
          echo "Quark file exists ✓"
          cat sc-clip.quark

      - name: Count classes
        run: |
          echo "Counting SuperCollider classes..."
          CLASS_COUNT=$(find Classes -name "*.sc" | wc -l)
          echo "Found $CLASS_COUNT class files"
          test "$CLASS_COUNT" -gt 0
          echo "Class count check passed ✓"

      - name: Report status
        if: success()
        run: echo "✅ sc-clip quark validated successfully!"
