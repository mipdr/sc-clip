name: Test Compilation

on:
  push:
    branches: ['**']  # Run on all branches
  pull_request:
    branches: ['**']

jobs:
  test-compile:
    runs-on: ubuntu-latest
    container:
      image: rukano/supercollider:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SuperCollider installation
        run: |
          which sclang || echo "sclang not in PATH"
          ls -la /usr/bin/sc* || true
          ls -la /usr/local/bin/sc* || true
          find / -name sclang 2>/dev/null || true

      - name: Install sc-clip quark
        run: |
          mkdir -p /root/.local/share/SuperCollider/Extensions
          ln -sfn $GITHUB_WORKSPACE /root/.local/share/SuperCollider/Extensions/sc-clip

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          timeout 120 sclang scripts/install-deps.scd

      - name: Run compilation test
        run: |
          echo "Running compilation test..."
          timeout 60 sclang scripts/test-compile.scd

      - name: Report status
        if: success()
        run: echo "✅ sc-clip quark compiled successfully!"
